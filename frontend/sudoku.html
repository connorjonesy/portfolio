<h1 id="abme">Daily Sudoku</h1>
<div id='sud_container'>
	<!-- Will be styled sudoku wise from sudoku css file -->
</div>
<div id="login_div">
	<h2>Log in to play!</h2>
	<button id="login_btn" class="login_btns">Log In</button>
	<button id="register_btn" class="login_btns">Register</button>

	<form id="login_form" action="" method="post" style="display:none;">
	    <fieldset>
		    <legend>Log In</legend>
		    <label for="username_login">Username: </label>
		    <input type="text" id="username_login">
		    <br><br>
		    <label for="pw_login">Password: </label>
		    <input type="password" id="pw_login">
		    <br><br>
		    <input type="submit" value="Log In" id="login_submit">
	    </fieldset>
	</form>

	<form id="register_form" action="" method="post" style="display:none;">
	    <fieldset>
		    <legend>Register</legend>
		    <label for="username_reg">Username: </label>
		    <input type="text" id="username_reg">
		    <br><br>
		    <label for="pw_reg">Password: </label>
		    <input type="password" id="pw_reg">
		    <br><br>
		    <label for="email_reg">Email Address: </label>
		    <input type="email" id="email_reg" size="30" required />
		    <br><br>
		    <input type="submit" value="Register" id="reg_submit">
	    </fieldset>
	</form>
</div>
